<style>
  /* ============ 设计令牌（与高考图谱同一套视觉语言：清华紫 + 紫偏中性色） ============ */
  :root {
    --ground:#f6f5f9; --surface:#ffffff; --surface-2:#f1eef7;
    --ink:#1b1930; --ink-mute:#605a75; --ink-faint:#8f89a3;
    --border:#e5e1ee; --border-strong:#d3cce2;
    --accent:#7d2b8f; --accent-soft:#efe2f4; --accent-line:#c79ad4;
    --wrong:#c0392b; --wrong-soft:#fbe9e7;
    --right:#2f8f5b; --right-soft:#e6f4ec;
    --gold:#a9772e;
    --shadow:0 1px 2px rgba(27,25,48,.05),0 8px 24px rgba(27,25,48,.06);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#131120; --surface:#1b1830; --surface-2:#221e3a;
      --ink:#ece9f5; --ink-mute:#a49dbb; --ink-faint:#7a7391;
      --border:#2b2745; --border-strong:#3a3457;
      --accent:#bd7ad4; --accent-soft:#2e2140; --accent-line:#5a3b6e;
      --wrong:#e0645a; --wrong-soft:#3a211e;
      --right:#52b57e; --right-soft:#1c2f26;
      --gold:#d3a75c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{--ground:#f6f5f9;--surface:#fff;--surface-2:#f1eef7;--ink:#1b1930;--ink-mute:#605a75;--ink-faint:#8f89a3;--border:#e5e1ee;--border-strong:#d3cce2;--accent:#7d2b8f;--accent-soft:#efe2f4;--accent-line:#c79ad4;--wrong:#c0392b;--wrong-soft:#fbe9e7;--right:#2f8f5b;--right-soft:#e6f4ec;--gold:#a9772e;--shadow:0 1px 2px rgba(27,25,48,.05),0 8px 24px rgba(27,25,48,.06);}
  :root[data-theme="dark"]{--ground:#131120;--surface:#1b1830;--surface-2:#221e3a;--ink:#ece9f5;--ink-mute:#a49dbb;--ink-faint:#7a7391;--border:#2b2745;--border-strong:#3a3457;--accent:#bd7ad4;--accent-soft:#2e2140;--accent-line:#5a3b6e;--wrong:#e0645a;--wrong-soft:#3a211e;--right:#52b57e;--right-soft:#1c2f26;--gold:#d3a75c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    --sans:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); line-height: 1.65;
    -webkit-font-smoothing: antialiased; padding: 0 18px 70px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* 页眉 */
  header { padding: 40px 0 10px; }
  .eyebrow { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
  h1 { font-family:var(--serif); font-size:clamp(28px,5vw,40px); font-weight:700; letter-spacing:.01em; margin-bottom:10px; }
  .sub { color:var(--ink-mute); font-size:14px; max-width:56ch; }
  .sub b { color:var(--ink); }

  /* 统计条 */
  .stats { display:flex; gap:22px; margin-top:18px; flex-wrap:wrap; }
  .stat .n { font-family:var(--serif); font-size:26px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .stat .l { font-size:12px; color:var(--ink-faint); }

  /* 科目筛选 */
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:26px 0 20px; }
  .chip {
    font-family:inherit; font-size:13px; cursor:pointer;
    background:var(--surface); color:var(--ink-mute);
    border:1px solid var(--border); border-radius:20px; padding:6px 14px;
    transition:.12s; display:flex; align-items:center; gap:6px;
  }
  .chip:hover { border-color:var(--accent-line); }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip .cnt { font-size:11px; opacity:.7; font-variant-numeric:tabular-nums; }
  .chip.on .cnt { opacity:.85; }

  /* 错题卡 */
  .entries { display:grid; gap:14px; }
  .empty { text-align:center; color:var(--ink-faint); font-size:14px; padding:40px 0; }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-left:4px solid var(--accent); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; position:relative;
  }
  .card .top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .card .subj-tag { font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 10px; border-radius:6px; }
  .card .date { font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .card .del {
    margin-left:auto; background:none; border:none; cursor:pointer;
    color:var(--ink-faint); font-size:18px; line-height:1; padding:4px; border-radius:6px;
  }
  .card .del:hover { color:var(--wrong); background:var(--wrong-soft); }
  .q { font-size:15px; font-weight:600; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ans { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:520px){ .ans { grid-template-columns:1fr; } }
  .ans .box { border-radius:8px; padding:9px 12px; font-size:14px; }
  .ans .mine { background:var(--wrong-soft); }
  .ans .right { background:var(--right-soft); }
  .ans .lbl { font-size:11px; font-weight:700; letter-spacing:.05em; margin-bottom:2px; }
  .ans .mine .lbl { color:var(--wrong); }
  .ans .right .lbl { color:var(--right); }
  .ans .val { color:var(--ink); word-break:break-word; }
  .why, .fix { font-size:13.5px; padding:10px 12px; border-radius:8px; margin-top:8px; }
  .why { background:var(--surface-2); }
  .fix { border:1px dashed var(--accent-line); }
  .why .k, .fix .k { font-weight:700; margin-right:6px; }
  .why .k { color:var(--wrong); }
  .fix .k { color:var(--accent); }
  .why .v, .fix .v { color:var(--ink-mute); }

  /* 添加区 */
  .addbar { margin:30px 0 16px; display:flex; gap:10px; flex-wrap:wrap; }
  button.action {
    font-family:inherit; font-size:14px; cursor:pointer; font-weight:600;
    border-radius:9px; padding:10px 18px; transition:.12s; border:1px solid var(--border);
    background:var(--surface); color:var(--ink);
  }
  button.action:hover { border-color:var(--accent-line); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { filter:brightness(1.08); }

  .form {
    background:var(--surface); border:1px solid var(--border-strong);
    border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);
    display:none; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;
  }
  .form.open { display:grid; }
  .form .full { grid-column:1/-1; }
  .form label { font-size:12px; font-weight:700; color:var(--ink-mute); display:block; margin-bottom:5px; }
  .form input, .form textarea, .form select {
    width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--ground); border:1px solid var(--border); border-radius:8px; padding:9px 11px; resize:vertical;
  }
  .form input:focus, .form textarea:focus, .form select:focus { outline:2px solid var(--accent-line); border-color:transparent; }
  .form textarea { min-height:52px; }
  .form .btns { grid-column:1/-1; display:flex; gap:10px; }
  @media (max-width:520px){ .form { grid-template-columns:1fr; } }

  .tip { font-size:12.5px; color:var(--ink-faint); margin-top:6px; line-height:1.6; }
  .tip b { color:var(--ink-mute); }

  dialog { border:none; border-radius:12px; padding:0; max-width:90vw; background:transparent; }
  dialog::backdrop { background:rgba(10,8,20,.6); }
  .modal { background:var(--surface); color:var(--ink); border-radius:12px; padding:22px; width:520px; max-width:90vw; box-shadow:var(--shadow); }
  .modal h3 { margin-bottom:10px; }
  .modal textarea { width:100%; min-height:180px; font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--ground); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:10px; }
  .modal .btns { display:flex; gap:10px; margin-top:12px; justify-content:flex-end; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">错题本 · 冲刺清华的核武器</div>
    <h1>我的错题本</h1>
    <p class="sub">这里记的不是"抄题"，而是<b>"我当时是怎么想错的"</b>。每周把旧错题重做一遍，直到不再错——三年下来，等于给自己造了一套只针对你弱点的题库。</p>
    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">总错题数</div></div>
      <div class="stat"><div class="n" id="statSubj">0</div><div class="l">涉及科目</div></div>
      <div class="stat"><div class="n" id="statWeek">0</div><div class="l">最薄弱科目</div></div>
    </div>
  </header>

  <div class="filters" id="filters"></div>

  <div class="addbar">
    <button class="action primary" id="toggleAdd">＋ 添加错题</button>
    <button class="action" id="exportBtn">导出备份</button>
    <button class="action" id="importBtn">导入备份</button>
  </div>

  <div class="form" id="addForm">
    <div class="full">
      <label>科目</label>
      <select id="fSubj"></select>
    </div>
    <div class="full">
      <label>题目（把题干和选项一起贴进来）</label>
      <textarea id="fQ" placeholder="例：It was the first time that he ___ abroad. A. went B. had gone ..."></textarea>
    </div>
    <div>
      <label>我的错误答案</label>
      <input id="fMine" placeholder="例：A. went">
    </div>
    <div>
      <label>正确答案</label>
      <input id="fRight" placeholder="例：C. had gone">
    </div>
    <div class="full">
      <label>错在哪一步（我当时的错误思路）</label>
      <textarea id="fWhy" placeholder="例：只按'出国是过去的事'选了一般过去时，没认出这是固定句型"></textarea>
    </div>
    <div class="full">
      <label>正确思路 / 该记的规则</label>
      <textarea id="fFix" placeholder="例：It is/was the first time that + 主语 + has/had done。看到就锁定完成时。"></textarea>
    </div>
    <div class="btns">
      <button class="action primary" id="saveBtn">保存</button>
      <button class="action" id="cancelBtn">取消</button>
    </div>
  </div>

  <div class="entries" id="entries"></div>

  <p class="tip" style="margin-top:26px">
    <b>数据存在哪：</b>所有错题保存在你这台设备的浏览器里，不会上传，关掉页面也不会丢。
    换设备或想备份，用上面的「导出备份」把内容复制下来。
  </p>

</div>

<dialog id="ioDialog"><div class="modal">
  <h3 id="ioTitle">导出备份</h3>
  <p class="tip" id="ioHint" style="margin-bottom:10px"></p>
  <textarea id="ioText"></textarea>
  <div class="btns">
    <button class="action" id="ioClose">关闭</button>
    <button class="action primary" id="ioAction">复制</button>
  </div>
</div></dialog>

<script>
/* ================= 数据层 ================= */
const SUBJECTS = ['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
const KEY = 'my_mistake_book_v2';
const OLD_KEYS = ['my_mistake_book_v1'];

// 首次打开时，用今天真实答错的英语题作为种子（之后所有增删都存在浏览器里）
const SEED = [
  {
    id: 1, subject:'英语', date:'2026-07-22',
    q:'It was the first time that he ______ abroad; everything looked new to him.\nA. went　B. has gone　C. had gone　D. goes',
    mine:'A. went',
    right:'C. had gone',
    why:'只按"出国是过去的事"选了一般过去时，没认出这是固定句型。',
    fix:'固定句型：It is/was the first/second time that + 主语 + has/had done。前面是 was 就配 had done（过去的过去）。看到 "the first time that..." 立刻锁定完成时，别用一般过去时。'
  },
  {
    id: 2, subject:'英语', date:'2026-07-22',
    q:'中译英：为了赶上末班车，他跑得飞快。',
    mine:'He runs quickly to catch the last bus.',
    right:'He ran as fast as he could to catch the last bus.',
    why:'中译英前没判断时态，用了现在时 runs；"飞快"用 quickly 力度也不够。',
    fix:'翻译前先问一句"这是什么时候的事"——过去的场景用 ran。强调"拼命跑"可用 as fast as he could，比 quickly 有力。'
  },
  {
    id: 3, subject:'英语', date:'2026-07-22',
    q:'中译英：我到家的时候，妈妈已经做好了晚饭。',
    mine:'By the time I got home, my mother had cooked the dinner.',
    right:'By the time I got home, my mother had cooked dinner.',
    why:'dinner 前多加了 the。',
    fix:'三餐名词 breakfast / lunch / dinner 前一般不加冠词：have dinner、cook dinner。（过去完成 had cooked 这里用得对，值得表扬。）'
  },
  {
    id: 4, subject:'化学', date:'2026-07-25',
    q:'标准状况下，3.36 L 的 SO₂ 气体，求它的物质的量 n。（Vm=22.4 L/mol）',
    mine:'n = 3.36 ÷ 22.4 = 1.5 mol',
    right:'n = 3.36 ÷ 22.4 = 0.15 mol',
    why:'公式、单位都对，只是小数除法算错，小数点点错一位（把 0.15 算成了 1.5，整整差 10 倍）。而且错了没发现，后面 m、分子数、原子数全被带偏。',
    fix:'算完一步立刻「反乘验算」：若 n=1.5，则 V=1.5×22.4=33.6 L≠题目的 3.36 L，一眼就露馅。正确 0.15×22.4=3.36 ✓。数理化凡是能反推的，求出中间量就回头乘回去对一遍，多花 3 秒救一整道大题。'
  },
  {
    id: 5, subject:'生物', date:'2026-07-25',
    q:'构成细胞膜的重要脂质是哪一种？（磷脂 / 固醇 / 脂肪）',
    mine:'固醇',
    right:'磷脂',
    why:'把「固醇」和「磷脂」记混了。固醇是管调节的（胆固醇、性激素、维生素D），不是造膜的主力。',
    fix:'记「磷脂造膜」——磷脂有亲水头+疏水尾，正好排成膜，是细胞膜的重要成分。脂质三类各记一个标签：脂肪=主要储能、磷脂=造细胞膜、固醇=调节。'
  },
  {
    id: 6, subject:'生物', date:'2026-07-25',
    q:'噬菌体是专门感染什么的病毒？',
    mine:'感染细胞',
    right:'感染细菌',
    why:'答得太笼统，写成「细胞」。噬菌体是专门寄生在细菌里的病毒。',
    fix:'看名字拆字：「噬菌体」的「菌」= 细菌，「噬」= 吞噬，所以是「专门感染细菌的病毒」（如大肠杆菌噬菌体）。答病毒宿主要具体到「细菌」，不能只说「细胞」。'
  },
  {
    id: 7, subject:'英语', date:'2026-07-25',
    q:'定语从句填关系词：The house ____ windows face south is warm in winter.',
    mine:'that',
    right:'whose',
    why:'把「房子的窗户」这个所有格关系当成了主/宾关系，填了 that；还误以为 whose 只能指人。',
    fix:'能翻成「……的（东西）」就用 whose，而且 whose 既能指人也能指物：the house whose windows…=房子的窗户。判断法：先看关系词在从句里是不是「所有格（…的）」，是就用 whose，跟先行词是人是物无关。'
  },
  {
    id: 8, subject:'英语', date:'2026-07-25',
    q:'指代整个主句时 as 还是 which：① Water, ____ we call H₂O, is essential. ② He said he had read it, ____ was a lie.',
    mine:'两处都填 as',
    right:'两处都填 which',
    why:'一看到「指代整句」就条件反射填 as。其实 as 只用于固定的「正如」评论套路，其余一律 which。',
    fix:'一刀切判断法：把空替换成中文「正如……」，读得通才用 as（as we know / as is reported / as expected / as is the case），读不通就用 which。「正如是个谎言」不通→which；「正如我们所料 as we expected」通→as。默认中性指代都用 which。'
  },
  {
    id: 9, subject:'英语', date:'2026-07-25',
    q:'定语从句填关系词：The old man ____ we spoke just now is a famous scientist.（speak to sb）',
    mine:'whom',
    right:'to whom（或 whom … we spoke to）',
    why:'只填了 whom，忘了动词是 speak TO sb，把介词 to 丢了，句子缺了介词。',
    fix:'spoke to / talk to / look at / listen to 这类「动词+介词」，关系词要么带介词前置（to whom we spoke），要么把介词留在句尾（whom we spoke to）。填空前先想清楚这个动词后面跟不跟介词，别把介词漏掉。'
  },
  {
    id: 10, subject:'英语', date:'2026-07-26',
    q:'名词性从句：为什么一个用 that、一个用 what？能不能对调？\n① I believe ____ he is right.（that）\n② I believe ____ he said.（what）',
    mine:'he is right 成分完整所以用 that；what 后面是名词性从句，所以不能换。',
    right:'①用 that 因为从句 he is right 成分完整；②用 what 因为 he said 后面缺宾语，what 要跳进去补上（what = the thing that）。',
    why:'that 那一半理由说对了，what 那一半用「后面是名词性从句」搪塞——可两句都是名词性从句，这根本不构成区分标准，说明当时只记住了结论没抓住原理。',
    fix:'一把尺子量到底：用手指盖住引导词，只读后半句，数成分。从句缺成分 → 用有意义、能当成分的词去补（what/who/which）；从句不缺 → 用不作成分的 that。这条规则同时管宾语从句、主语从句、表语从句、同位语从句和定语从句。'
  },
  {
    id: 11, subject:'英语', date:'2026-07-26',
    q:'判断是同位语从句还是定语从句：\n(a) I have no idea that he will leave tomorrow.\n(b) The idea that he put forward is useful.',
    mine:'(a) 定语从句　(b) 同位语从句',
    right:'(a) 同位语从句　(b) 定语从句（正好判反了）',
    why:'靠「看起来像不像在修饰名词」的语感去猜，没有动手数从句成分，结果两个全反。',
    fix:'还是数成分：(a) he will leave tomorrow 主谓状齐全，不缺 → that 只作连接 → 同位语从句；(b) he put forward 后面缺宾语 → that 进去当宾语 → 定语从句。辅助验证：翻成「……的想法/消息」说得通就是同位语（他明天要走这个想法 ✓；他提出这个想法 ✗，idea 不等于「他提出」）。'
  },
  {
    id: 12, subject:'英语', date:'2026-07-26',
    q:'主语从句填空：____ breaks the rule will be punished, no matter who he is.',
    mine:'That',
    right:'Whoever（= Anyone who / He who）',

    why:"把 1/(x−2)+1 在 x>2 上的值域误限制在 (1,2)，忽略 x→2+ 时 1/(x−2) 可以趋向 +∞；判断整体单调时只比较了两段趋势，没有给跨段 x1<x2 的反例。",
    fix:"遇到 1/(x−a)+b 且 x>a：先写 x−a>0，所以 1/(x−a)>0；当 x→a+ 时趋向 +∞，当 x→+∞ 时趋向 0+，因此值域是 (b,+∞)。分段整体单调结论必须附跨段反例或全域证明。"
  },
  {
    id: 184, subject:"数学", date:"2026-09-03",
    q:"分段函数综合：f(x)=(x−1)²−4 (x≤1), −3/(x−1)+2 (x>1)。求定义域、两段值域、总值域，并解 f(x)=5。",
    mine:"定义域任意实数；第一段值域 [-4,+∞)；第二段值域写成 (2,+∞)；总值域 [-4,+∞)；方程解写 x=-2 来自第一段，x=0 来自第二段。",
    right:"定义域 R；第一段 x≤1 时值域 [-4,+∞)；第二段 x>1 时 x−1>0，−3/(x−1)<0，所以值域 (-∞,2)；总值域 R。解 f(x)=5：第一段 (x−1)²−4=5，得 x=4 或 x=-2，只有 x=-2 满足 x≤1；第二段 −3/(x−1)+2=5，得 x=0，但 x=0 不满足 x>1，舍去。最后只有 x=-2。",
    why:"看到 1/(x−1) 在右侧为正后，漏掉前面的负号 −3，导致第二段值域方向反了；解分段方程时解出代数答案后没有检查它是否属于该段定义范围，把 x=0 错留在第二段。",
    fix:"分段函数先看系数符号：x>a 时 1/(x−a)>0，若前面乘负数，则整体在 0 的下方，平移后是 (-∞,b)。解 f(x)=c 时每段都按‘列方程→解→代回本段范围检查→不符合就舍’四步走。"
  },
  {
    id: 185, subject:"数学", date:"2026-09-03",
    q:"分段函数参数单调：f(x)=x²−2ax+1 (x≤1), 2x+a (x>1)。若 f(x) 在 R 上单调递增，求 a 的范围。",
    mine:"认为第一段对称轴 x=a，要让第一段在 (-∞,1] 上递增需 a≥1；跳点条件 2−2a≤a+2 算成没意义，最后答 a≥1。",
    right:"不存在这样的实数 a。因为第一段 x²−2ax+1 是开口向上的二次函数，在 (-∞,a] 上递减、在 [a,+∞) 上递增。区间 (-∞,1] 向左无限延伸，不可能完全落在对称轴右侧，所以第一段不可能在整个 (-∞,1] 上递增。仅这一条已矛盾，无需再合并跳点条件。",
    why:"把二次函数单调区间方向想反了：开口向上时，对称轴左边递减、右边递增；要在某区间递增，整个区间必须在对称轴右侧，但 (-∞,1] 不可能全部在任何有限 a 的右侧。另一个问题是 2−2a≤a+2 应化为 a≥0，不是无意义。",
    fix:"遇到二次函数全区间单调，先写标准单调区间：开口向上：(-∞,对称轴] 递减，[对称轴,+∞) 递增；开口向下相反。若目标区间是半无限区间，先判断它能否完全落在对应单调区间内；不可能时直接判无解。代数不等式每步保留 a 项，别把含 a 的不等式算成常数句。"
  },

];

let data = load();
let filter = 'all';

function load() {
  try {
    const merged = [];
    const ids = new Set();
    const add = entries => {
      if (!Array.isArray(entries)) return;
      for (const e of entries) {
        if (!e || typeof e !== 'object') continue;
        const id = e.id ?? `${e.subject || ''}|${e.date || ''}|${e.q || ''}`;
        if (ids.has(id)) continue;
        ids.add(id);
        merged.push(e);
      }
    };
    const read = key => {
      const raw = localStorage.getItem(key);
      if (raw === null) return [];
      try { return JSON.parse(raw); } catch (e) { return []; }
    };
    add(SEED);
    add(read(KEY));
    for (const oldKey of OLD_KEYS) add(read(oldKey));
    localStorage.setItem(KEY, JSON.stringify(merged));
    return merged;
  } catch (e) { return SEED.slice(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

/* ================= 渲染 ================= */
const $ = id => document.getElementById(id);

function render() {
  // 统计
  $('statTotal').textContent = data.length;
  const bySubj = {};
  for (const e of data) bySubj[e.subject] = (bySubj[e.subject] || 0) + 1;
  $('statSubj').textContent = Object.keys(bySubj).length;
  let worst = '—', worstN = 0;
  for (const s in bySubj) if (bySubj[s] > worstN) { worstN = bySubj[s]; worst = s; }
  $('statWeek').textContent = worst;
  $('statWeek').style.fontSize = '20px';

  // 筛选条
  const f = $('filters');
  f.innerHTML = '';
  const mk = (key, label, cnt) => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === key ? ' on' : '');
    b.innerHTML = `${label} <span class="cnt">${cnt}</span>`;
    b.onclick = () => { filter = key; render(); };
    f.appendChild(b);
  };
  mk('all', '全部', data.length);
  for (const s of SUBJECTS) if (bySubj[s]) mk(s, s, bySubj[s]);

  // 错题卡
  const box = $('entries');
  const list = data.filter(e => filter === 'all' || e.subject === filter)
                   .slice().reverse();
  if (!list.length) {
    box.innerHTML = `<div class="empty">这个科目还没有错题。<br>答错了就点上面「＋ 添加错题」记下来 —— 越早开始，这本武器越厉害。</div>`;
    return;
  }
  box.innerHTML = '';
  for (const e of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <span class="subj-tag">${esc(e.subject)}</span>
        <span class="date">${esc(e.date || '')}</span>
        <button class="del" title="删除这道错题" data-id="${e.id}">✕</button>
      </div>
      <div class="q">${esc(e.q)}</div>
      <div class="ans">
        <div class="box mine"><div class="lbl">我的错答</div><div class="val">${esc(e.mine)}</div></div>
        <div class="box right"><div class="lbl">正确答案</div><div class="val">${esc(e.right)}</div></div>
      </div>
      ${e.why ? `<div class="why"><span class="k">错因</span><span class="v">${esc(e.why)}</span></div>` : ''}
      ${e.fix ? `<div class="fix"><span class="k">正确思路</span><span class="v">${esc(e.fix)}</span></div>` : ''}
    `;
    box.appendChild(card);
  }
  box.querySelectorAll('.del').forEach(b => b.onclick = () => delEntry(+b.dataset.id));
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

/* ================= 增 / 删 ================= */
function delEntry(id) {
  if (!confirm('确定删除这道错题吗？')) return;
  data = data.filter(e => e.id !== id);
  save(); render();
}

function addEntry() {
  const q = $('fQ').value.trim();
  const mine = $('fMine').value.trim();
  const right = $('fRight').value.trim();
  if (!q || !right) { alert('至少要填「题目」和「正确答案」。'); return; }
  data.push({
    id: Date.now(),
    subject: $('fSubj').value,
    date: new Date().toISOString().slice(0,10),
    q, mine: mine || '（未填）', right,
    why: $('fWhy').value.trim(),
    fix: $('fFix').value.trim(),
  });
  save();
  ['fQ','fMine','fRight','fWhy','fFix'].forEach(id => $(id).value = '');
  $('addForm').classList.remove('open');
  filter = 'all'; render();
}

/* ================= 交互接线 ================= */
function initForm() {
  const sel = $('fSubj');
  sel.innerHTML = SUBJECTS.map(s => `<option>${s}</option>`).join('');
  $('toggleAdd').onclick = () => $('addForm').classList.toggle('open');
  $('cancelBtn').onclick = () => $('addForm').classList.remove('open');
  $('saveBtn').onclick = addEntry;

  // 导出 / 导入
  const dlg = $('ioDialog');
  $('exportBtn').onclick = () => {
    $('ioTitle').textContent = '导出备份';
    $('ioHint').textContent = '把下面全部内容复制保存起来（比如发到微信文件传输助手）。换设备时用「导入备份」粘回去即可。';
    $('ioText').value = JSON.stringify(data, null, 2);
    $('ioText').readOnly = true;
    $('ioAction').textContent = '复制';
    $('ioAction').onclick = () => {
      $('ioText').select();
      try { document.execCommand('copy'); } catch(e){}
      $('ioAction').textContent = '已复制✓';
    };
    dlg.showModal();
  };
  $('importBtn').onclick = () => {
    $('ioTitle').textContent = '导入备份';
    $('ioHint').textContent = '把之前导出的内容粘贴进来，点「覆盖导入」。注意：这会替换掉当前所有错题。';
    $('ioText').value = '';
    $('ioText').readOnly = false;
    $('ioAction').textContent = '覆盖导入';
    $('ioAction').onclick = () => {
      try {
        const arr = JSON.parse($('ioText').value);
        if (!Array.isArray(arr)) throw 0;
        data = arr; save(); render(); dlg.close();
      } catch(e) { alert('内容格式不对，请粘贴完整的导出备份。'); }
    };
    dlg.showModal();
  };
  $('ioClose').onclick = () => dlg.close();
}

initForm();
render();
</script>
